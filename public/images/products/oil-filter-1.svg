  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="28" y="28" width="112" height="24" fill="none" stroke="#e10600" stroke-opacity=".65"/>
    <text x="40" y="45" fill="#e10600" font-size="10" font-weight="700" letter-spacing="2.4">DEMO ASSET</text>
    <text x="28" y="556" fill="#8e97a2" font-size="12" letter-spacing=".6">Demo product image · replace with a real photo</text>
    <text x="28" y="576" fill="#5b636d" font-size="12" font-family="Tahoma, Segoe UI, sans-serif">صورة منتج تجريبية · استبدلها بصورة حقيقية</text>
    <text x="772" y="556" fill="#4d545d" font-size="11" text-anchor="end">VIEW 01 / 02</text>
